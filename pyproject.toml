[project]
name = "production-rag-system"
version = "0.1.1"
description = "Production RAG system for querying technical documentation (Sinergym / EnergyPlus) with source references."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alejandro Campoy Nieves" }]
requires-python = ">=3.12"
dependencies = [
    # Added per phase (FastAPI, LangChain, pgvector client, ...).
]

[dependency-groups]
dev = [
    # Documentation
    "mkdocs-material>=9.8.1",
    # Testing
    "pytest>=9.2.0",
]

[tool.uv]
# Package the project in editable mode so `uv run` / `uv sync` expose it as a library.
package = true

[build-system]
requires = ["uv_build>=0.13,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Keep tests at the repo root, outside the package: not shipped in the wheel.
testpaths = ["tests"]

# Tool configurations (ruff, ...) will be added here as they are adopted.
