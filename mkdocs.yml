site_name: Production RAG System
site_description: RAG system for querying technical documentation (Sinergym / EnergyPlus) with source references.
site_url: https://alejandrocampoy.github.io/production-rag-system/
repo_url: https://github.com/AlejandroCampoy/production-rag-system

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Development: development.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # Mermaid diagrams render natively (planned for the architecture pages).
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
